services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    build: .
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
      # Remaining configuration comes from the environment the container is
      # started with (docker run --env-file .env or a compose override file).
    ports:
      - "8000:8000"

volumes:
  qdrant_data:
